version: 2
updates:
  # 1. GitHub Actions - Base
    - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 3
    labels:
            - "ecotecno"
            - "bot:dependabot"
            - "orquestacion:madre"
            - "MAPA830324UM9"
            - "ORES-check"
    assignees:
            - "alfreddlove83"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # 2. Docker - Cara pública y Madre (mismo accionamiento)
    - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
            - "ecotecno"
            - "bot:docker"
            - "ORES-check"

  # 3. Go Mod - Si usas Go en asdf
    - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
            - "ecotecno"
            - "lang:go"
            - "ORES-check"

