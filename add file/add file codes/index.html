<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrick_IA - Módulo de Validación 360</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            border: 2px solid #333333;
            padding: 30px;
            border-radius: 12px;
            background: #050505;
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.05);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #00ffcc;
            text-align: center;
        }
        .subtitle {
            font-size: 12px;
            color: #888888;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .data-box {
            background: #111111;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00ffcc;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            background: #003322;
            color: #00ffaa;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            width: fit-content;
        }
        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: #444444;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Andrick_IA</h1>
    <div class="subtitle">SISTEMA INTEGRADO DE VALIDACIÓN QR</div>

    <!-- Los datos se inyectarán aquí dinámicamente desde AMP-CODE-LINK.js -->
    <div class="data-box" id="identidad-box">
        Cargando parámetros del núcleo inmutable...
    </div>

    <div class="status-badge" id="sw-status">Service Worker: Verificando...</div>

    <div class="footer-text">
        EcoTecNo Global Co ™® Hybrid System 360 ®<br>
        Licencia Apache 2.0 | #VoluntadDeFamiliaDigital2026<br>
        <strong>No se borra, se corrige y se documenta.</strong>
    </div>
</div>

<script type="module">
    // 1. Importar las variables de identidad privadas desde el módulo local
    import AMP from './AMP-CODE-LINK.js';

    // 2. Inyectar datos en la interfaz visual en tiempo real
    const infoBox = document.getElementById('identidad-box');
    if (AMP) {
        infoBox.innerHTML = `
            <strong>Titular:</strong> ${AMP.autor}<br>
            <strong>RFC:</strong> ${AMP.rfc}<br>
            <strong>idCIF:</strong> ${AMP.idCIF}<br>
            <strong>Versión:</strong> ${AMP.version}<br>
            <strong>Folio:</strong> ${AMP.folio_maestro}<br>
            <strong>Lema:</strong> <em>"${AMP.lema}"</em>
        `;
    }

    // 3. Registrar el Service Worker (sw.js) para soporte offline absoluto
    const swStatus = document.getElementById('sw-status');
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    swStatus.textContent = "Service Worker: ACTIVO (Local 0ms)";
                    swStatus.style.background = "#003322";
                    swStatus.style.color = "#00ffaa";
                })
                .catch(error => {
                    swStatus.textContent = "Service Worker: Error de enlace local";
                    swStatus.style.background = "#331111";
                    swStatus.style.color = "#ff5555";
                    console.error('Fallo en SW:', error);
                });
        });
    } else {
        swStatus.textContent = "Entorno no compatible con PWA";
    }
</script>

</body>
</html>
